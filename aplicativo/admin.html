<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Agendamentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- TELA DE LOGIN (Bloqueio com Senha) -->
    <div id="loginBox" class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm text-center">
        <h2 class="text-xl font-bold text-gray-800 mb-2">Área Restrita</h2>
        <p class="text-xs text-gray-500 mb-4">Digite a senha para gerenciar os agendamentos:</p>
        
        <input type="password" id="senhaInput" placeholder="Sua senha..." 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-pink-500 text-center text-lg">
        
        <button onclick="verificarSenha()" 
                class="w-full bg-pink-600 text-white font-semibold py-2 rounded-lg hover:bg-pink-700 transition">
            Entrar no Painel
        </button>
        
        <p id="erroSenha" class="text-red-500 text-xs font-semibold mt-3 hidden">Senha incorreta! Tente novamente.</p>
    </div>

    <!-- PAINEL DE AGENDAMENTOS (Oculto até colocar a senha) -->
    <div id="painelAdmin" class="hidden w-full max-w-4xl bg-white p-6 rounded-2xl shadow-md">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">📋 Painel de Agendamentos</h1>
                <p class="text-xs text-gray-500">Acompanhe os horários marcados pelas clientes</p>
            </div>
            <button onclick="sairAdmin()" class="text-xs font-semibold text-red-600 bg-red-50 px-3 py-2 rounded-lg hover:bg-red-100 transition">
                Sair / Bloquear
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-pink-50 text-pink-700 border-b border-pink-100 text-sm">
                        <th class="p-3">Cliente</th>
                        <th class="p-3">WhatsApp</th>
                        <th class="p-3">Serviço</th>
                        <th class="p-3">Data e Horário</th>
                        <th class="p-3">Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaAgendamentos" class="divide-y divide-gray-100 text-sm">
                    <!-- Os agendamentos carregam aqui via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Importa a lógica do app.js (onde está a conexão do Supabase) -->
    <script src="app.js"></script>

    <!-- Lógica de Controle da Senha -->
    <script>
        // DIGITE A SUA SENHA AQUI DENTRO DAS ASPAS (Exemplo: "1234" ou "salao2026")
        const SENHA_MESTRE = "1996"; 

        function verificarSenha() {
            const digitada = document.getElementById('senhaInput').value;
            const erro = document.getElementById('erroSenha');

            if (digitada === SENHA_MESTRE) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('painelAdmin').classList.remove('hidden');
                
                // Dispara a busca de agendamentos no Supabase
                if (typeof carregarAgendamentos === 'function') {
                    carregarAgendamentos();
                }
            } else {
                erro.classList.remove('hidden');
                document.getElementById('senhaInput').value = '';
            }
        }

        function sairAdmin() {
            document.getElementById('painelAdmin').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('senhaInput').value = '';
            document.getElementById('erroSenha').classList.add('hidden');
        }
    </script>
</body>
</html>
